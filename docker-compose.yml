services:
  postgres:
    image: postgres:16-alpine
    container_name: p1-postgres
    environment:
      POSTGRES_USER: videos
      POSTGRES_PASSWORD: videos
      POSTGRES_DB: videos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videos -d videos"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: p1-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: videos
      RABBITMQ_DEFAULT_PASS: videos
    ports:
      - "5673:5672"
      - "15673:15672"   # painel de gestão: http://localhost:15673
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: p1-redis
    # allkeys-lru: as chaves aqui são cache de status (cache-aside) e
    # contadores de rate limit, todas de vida curta e sem persistência
    # exigida — mesma lógica de "remover o que está ocioso primeiro" usada
    # para sessões (ver README/ADR "Política de evicção").
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p1-api
    command: node src/server.js
    environment:
      PORT: 3000
      DATABASE_URL: postgres://videos:videos@postgres:5432/videos
      REDIS_URL: redis://redis:6379
      STORAGE_PATH: /app/storage
      TRANSCRIPTION_API_URL: http://transcription.invalid/v1
      CACHE_TTL_SECONDS: 30
      CACHE_JITTER_SECONDS: 10
      CACHE_NOT_FOUND_TTL_SECONDS: 60
      RATE_LIMIT_WINDOW_SECONDS: 60
      RATE_LIMIT_MAX: 20
    ports:
      - "3000:3000"
    volumes:
      - storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Sem depender do RabbitMQ: a API só grava no Postgres (vídeo + evento na
    # outbox). Quem publica na fila é o outbox-relay — a API aceita uploads
    # normalmente mesmo se o broker estiver fora do ar (ver README/ADR).

  # sem container_name: permite `docker compose up -d --scale worker=3`
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: node src/worker.js
    environment:
      DATABASE_URL: postgres://videos:videos@postgres:5432/videos
      RABBITMQ_URL: amqp://videos:videos@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      STORAGE_PATH: /app/storage
      TRANSCRIPTION_API_URL: http://transcription.invalid/v1
    volumes:
      - storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Outbox relay (Polling Publisher): drena a tabela `outbox` e publica cada
  # evento pendente na fila AMQP (ver README/ADR "Transactional Outbox").
  # Tem container_name de propósito — ao contrário do worker, não faz
  # sentido escalar isso horizontalmente neste projeto (o volume de uploads
  # não justifica; `FOR UPDATE SKIP LOCKED` já deixaria seguro se precisasse).
  outbox-relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p1-outbox-relay
    command: node src/outboxRelay.js
    environment:
      DATABASE_URL: postgres://videos:videos@postgres:5432/videos
      RABBITMQ_URL: amqp://videos:videos@rabbitmq:5672
      OUTBOX_POLL_INTERVAL_MS: 500
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  storage:
