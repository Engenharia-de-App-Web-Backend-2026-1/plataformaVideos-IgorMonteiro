<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>P1 - Processamento de Vídeo</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; }
    progress { width: 100%; height: 24px; }
    #status { margin-top: 8px; font-size: 14px; color: #333; }
  </style>
</head>
<body>
  <h1>Enviar vídeo</h1>
  <form id="upload-form">
    <input type="file" name="video" id="video-input" accept="video/*" required />
    <button type="submit">Enviar</button>
  </form>
  <progress id="progress-bar" value="0" max="100"></progress>
  <div id="status">Aguardando envio...</div>

  <script>
    const form = document.getElementById('upload-form');
    const progressBar = document.getElementById('progress-bar');
    const statusEl = document.getElementById('status');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const fileInput = document.getElementById('video-input');
      if (!fileInput.files[0]) return;

      const formData = new FormData();
      formData.append('video', fileInput.files[0]);

      statusEl.textContent = 'Enviando...';
      const response = await fetch('/videos', { method: 'POST', body: formData });
      if (!response.ok) {
        statusEl.textContent = 'Falha no envio.';
        return;
      }

      const { videoId } = await response.json();
      statusEl.textContent = `Enviado. Processando ${videoId}...`;

      const source = new EventSource(`/videos/${videoId}/progress`);
      source.onmessage = (evt) => {
        const update = JSON.parse(evt.data);
        if (typeof update.percent === 'number') {
          progressBar.value = update.percent;
        }
        statusEl.textContent = `${update.stage}... ${update.percent ?? ''}%`;

        if (update.status === 'completed' || update.status === 'failed') {
          statusEl.textContent += update.status === 'completed' ? ' - concluído!' : ' - falhou.';
          source.close();
        }
      };
    });
  </script>
</body>
</html>
