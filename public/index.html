<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>P1 - Processamento de Vídeo</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --card: #171a21;
      --card-border: #262b36;
      --text: #e8eaef;
      --muted: #97a0b3;
      --accent: #5b8cff;
      --accent-dim: #2e3d63;
      --ok: #3ddc97;
      --fail: #ff6b6b;
      --track: #262b36;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      max-width: 560px;
      margin: 40px auto;
      padding: 0 20px 60px;
      background: var(--bg);
      color: var(--text);
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .dropzone {
      border: 2px dashed var(--card-border);
      border-radius: 10px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .dropzone.dragover {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .dropzone input { display: none; }

    .dropzone .hint {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    #file-name {
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--accent);
      word-break: break-all;
    }

    fieldset {
      border: none;
      padding: 0;
      margin: 20px 0 0;
    }

    legend {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 10px;
      padding: 0;
    }

    .action-group {
      display: grid;
      gap: 8px;
    }

    .action-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: #1d212b;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .action-row input[type="checkbox"] {
      margin-top: 3px;
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    .action-row label {
      cursor: pointer;
      flex: 1;
    }

    .action-row .title {
      font-size: 0.92rem;
    }

    .action-row .desc {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
    }

    #actions-hint {
      font-size: 0.8rem;
      color: var(--fail);
      margin-top: 8px;
      min-height: 1.2em;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #0b0d12;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      border-radius: 6px;
      background: var(--track);
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--ok));
      transition: width 0.3s ease;
    }

    #status {
      margin-top: 10px;
      font-size: 0.88rem;
      color: var(--text);
    }

    #status.completed { color: var(--ok); }
    #status.failed { color: var(--fail); }

    .destination {
      margin-top: 14px;
      display: none;
    }

    .destination.visible { display: block; }

    .destination .label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .destination-dir {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.82rem;
      color: var(--accent);
      margin-bottom: 8px;
    }

    ul#file-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 6px;
    }

    ul#file-list li {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      background: #1d212b;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    ul#file-list li .path { word-break: break-all; }

    ul#file-list li .badge {
      flex-shrink: 0;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--track);
      color: var(--muted);
    }

    ul#file-list li.ready .badge {
      background: rgba(61, 220, 151, 0.15);
      color: var(--ok);
    }

    a.badge {
      text-decoration: none;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s ease;
    }

    a.badge:hover {
      background: var(--ok);
      color: #0b0d12;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Enviar vídeo</h1>
  <p class="subtitle">
    Escolha exatamente o que o processamento deve fazer com o vídeo — nada é
    executado automaticamente além do que você marcar abaixo.
  </p>

  <form id="upload-form">
    <div class="card">
      <label class="dropzone" id="dropzone" for="video-input">
        <div id="dropzone-text">Clique ou arraste um vídeo aqui</div>
        <div class="hint">MP4, MOV, MKV...</div>
        <input type="file" name="video" id="video-input" accept="video/*" required />
      </label>
      <div id="file-name"></div>

      <fieldset>
        <legend>Resoluções para converter</legend>
        <div class="action-group">
          <div class="action-row">
            <input type="checkbox" name="resolutions" value="360p" id="res-360" />
            <label for="res-360">
              <div class="title">360p</div>
              <div class="desc">Menor qualidade, arquivo mais leve</div>
            </label>
          </div>
          <div class="action-row">
            <input type="checkbox" name="resolutions" value="720p" id="res-720" checked />
            <label for="res-720">
              <div class="title">720p</div>
              <div class="desc">Boa relação entre qualidade e tamanho</div>
            </label>
          </div>
          <div class="action-row">
            <input type="checkbox" name="resolutions" value="1080p" id="res-1080" />
            <label for="res-1080">
              <div class="title">1080p</div>
              <div class="desc">Qualidade máxima, processamento mais lento</div>
            </label>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Outras ações</legend>
        <div class="action-group">
          <div class="action-row">
            <input type="checkbox" name="extractAudio" id="extract-audio" value="true" />
            <label for="extract-audio">
              <div class="title">Extrair áudio</div>
              <div class="desc">Gera um .mp3 e tenta legendagem automática a partir dele</div>
            </label>
          </div>
          <div class="action-row">
            <input type="checkbox" name="watermark" id="watermark" value="true" />
            <label for="watermark">
              <div class="title">Aplicar marca d'água</div>
              <div class="desc">Só tem efeito se pelo menos uma resolução estiver marcada</div>
            </label>
          </div>
        </div>
      </fieldset>

      <div id="actions-hint"></div>

      <button type="submit" id="submit-btn">Enviar</button>
    </div>
  </form>

  <div class="card">
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div id="status">Aguardando envio...</div>

    <div class="destination" id="destination">
      <div class="label">Destino do(s) arquivo(s) resultante(s)</div>
      <div class="destination-dir" id="destination-dir"></div>
      <ul id="file-list"></ul>
    </div>
  </div>

  <script>
    const form = document.getElementById('upload-form');
    const dropzone = document.getElementById('dropzone');
    const dropzoneText = document.getElementById('dropzone-text');
    const fileInput = document.getElementById('video-input');
    const fileNameEl = document.getElementById('file-name');
    const submitBtn = document.getElementById('submit-btn');
    const progressFill = document.getElementById('progress-fill');
    const statusEl = document.getElementById('status');
    const actionsHint = document.getElementById('actions-hint');
    const destinationEl = document.getElementById('destination');
    const destinationDirEl = document.getElementById('destination-dir');
    const fileListEl = document.getElementById('file-list');
    let currentVideoId = null;

    // --- dropzone / seleção de arquivo -------------------------------
    dropzone.addEventListener('dragover', (event) => {
      event.preventDefault();
      dropzone.classList.add('dragover');
    });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (event) => {
      event.preventDefault();
      dropzone.classList.remove('dragover');
      if (event.dataTransfer.files[0]) {
        fileInput.files = event.dataTransfer.files;
        updateFileName();
      }
    });
    fileInput.addEventListener('change', updateFileName);

    function updateFileName() {
      const file = fileInput.files[0];
      fileNameEl.textContent = file ? `Selecionado: ${file.name}` : '';
      dropzoneText.textContent = file ? 'Trocar arquivo' : 'Clique ou arraste um vídeo aqui';
    }

    // --- validação de "pelo menos uma ação" ---------------------------
    function selectedResolutions() {
      return Array.from(document.querySelectorAll('input[name="resolutions"]:checked')).map((el) => el.value);
    }

    function hasAnyAction() {
      const extractAudio = document.getElementById('extract-audio').checked;
      return selectedResolutions().length > 0 || extractAudio;
    }

    function validateActions() {
      if (hasAnyAction()) {
        actionsHint.textContent = '';
        return true;
      }
      actionsHint.textContent = 'Selecione ao menos uma resolução ou a extração de áudio.';
      return false;
    }

    document.querySelectorAll('input[type="checkbox"]').forEach((el) => {
      el.addEventListener('change', validateActions);
    });

    // --- envio ----------------------------------------------------------
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!fileInput.files[0]) return;
      if (!validateActions()) return;

      const formData = new FormData();
      formData.append('video', fileInput.files[0]);
      selectedResolutions().forEach((res) => formData.append('resolutions', res));
      formData.append('extractAudio', document.getElementById('extract-audio').checked);
      formData.append('watermark', document.getElementById('watermark').checked);

      submitBtn.disabled = true;
      statusEl.className = '';
      statusEl.textContent = 'Enviando...';
      progressFill.style.width = '0%';
      destinationEl.classList.remove('visible');
      fileListEl.innerHTML = '';

      let response;
      try {
        response = await fetch('/videos', { method: 'POST', body: formData });
      } catch (err) {
        statusEl.className = 'failed';
        statusEl.textContent = 'Falha de rede ao enviar.';
        submitBtn.disabled = false;
        return;
      }

      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        statusEl.className = 'failed';
        statusEl.textContent = body.error || 'Falha no envio.';
        submitBtn.disabled = false;
        return;
      }

      const { videoId, destination } = await response.json();
      currentVideoId = videoId;
      statusEl.textContent = `Enviado. Processando ${videoId}...`;
      renderDestination(destination);

      const source = new EventSource(`/videos/${videoId}/progress`);
      source.onmessage = (evt) => {
        const update = JSON.parse(evt.data);
        if (typeof update.percent === 'number') {
          progressFill.style.width = `${update.percent}%`;
        }
        statusEl.textContent = `${update.stage}... ${update.percent ?? ''}%`;

        if (update.outputPath) {
          markFileReady(update.outputPath);
        }

        if (update.status === 'completed' || update.status === 'failed') {
          statusEl.className = update.status;
          statusEl.textContent += update.status === 'completed' ? ' — concluído!' : ' — falhou.';
          source.close();
          submitBtn.disabled = false;
        }
      };
    });

    function renderDestination(destination) {
      if (!destination) return;
      destinationDirEl.textContent = destination.directory;
      fileListEl.innerHTML = '';
      (destination.files || []).forEach((file) => {
        const li = document.createElement('li');
        li.dataset.file = file;
        li.innerHTML = `<span class="path">${file}</span><span class="badge">pendente</span>`;
        fileListEl.appendChild(li);
      });
      destinationEl.classList.toggle('visible', (destination.files || []).length > 0);
    }

    function markFileReady(outputPath) {
      const li = fileListEl.querySelector(`li[data-file="${CSS.escape(outputPath)}"]`);
      if (!li || !currentVideoId) return;
      li.classList.add('ready');

      const badge = li.querySelector('.badge');
      const link = document.createElement('a');
      link.className = 'badge';
      link.href = `/videos/${currentVideoId}/files/${encodeURIComponent(outputPath)}`;
      link.textContent = '⬇ baixar';
      link.download = outputPath;
      badge.replaceWith(link);
    }
  </script>
</body>
</html>
